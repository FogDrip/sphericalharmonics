name: Update latest Substack post

on:
  schedule:
    # Every 3 hours, so a new post shows up on the site within a few hours.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-post
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the latest post into index.html
        run: python3 scripts/update_latest_post.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update latest Substack post" -- index.html
          git push
